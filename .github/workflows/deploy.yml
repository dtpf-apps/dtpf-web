name: Deploy Frontend

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf

jobs:
  deploy:
    runs-on: [self-hosted, heavy]
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "app_suffix=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
          VITE_APP_SUFFIX: ${{ steps.env.outputs.app_suffix }}

      - name: Deploy to server
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          DEPLOY_DIR="/html/${{ env.SERVICE_NAME }}/$TARGET"

          # Send build artifacts
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}" \
            dist/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/client/

          echo "✓ Frontend deployed to $TARGET"

      - name: Auto-rerun on infra failure
        id: autorerun
        if: failure() && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.RERUN_TOKEN }}
        run: |
          LOGS=$(gh run view ${{ github.run_id }} --log-failed --repo ${{ github.repository }} 2>/dev/null || true)
          if echo "$LOGS" | grep -qE "Killed|exit code 137|exit 137|timed out in [0-9]+ms|Hook timed out"; then
            REASON=$(echo "$LOGS" | grep -oE "Killed|exit code 137|exit 137|timed out in [0-9]+ms|Hook timed out" | head -1)
            echo "::warning::Detected infra failure ($REASON), triggering auto-rerun"
            echo "triggered=true" >> $GITHUB_OUTPUT
            gh run rerun ${{ github.run_id }} --failed --repo ${{ github.repository }}
          else
            echo "Failure does not look like infra (no OOM/timeout match) — not rerunning"
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify build failure
        if: failure() && steps.autorerun.outputs.triggered != 'true'
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          MSG="❌ **${REPO}** deploy FAILED (${{ github.ref_name }})"
          curl -sf http://10.5.0.47:18789/tools/invoke \
            -H 'Authorization: Bearer ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "$MSG" '{
              tool: "message",
              action: "send",
              args: { message: $msg, to: "room:!UdPuWAOSDiENZBGANx:matrixdm", channel: "matrix" }
            }')" || echo "::warning::Element notification failed"

