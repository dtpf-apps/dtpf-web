name: Deploy Frontend

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SERVER: dtpf@10.5.0.165
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
            echo "dauth_url=${{ secrets.VITE_DAUTH_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "dauth_url=${{ secrets.VITE_DAUTH_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
          VITE_DAUTH_DOMAIN_NAME: ${{ secrets.VITE_DAUTH_DOMAIN_NAME }}
          VITE_DAUTH_URL: ${{ steps.env.outputs.dauth_url }}

      - name: Deploy to server
        run: |
          TARGET="${{ steps.env.outputs.target }}"
          DEPLOY_DIR="/html/${{ env.SERVICE_NAME }}/$TARGET"

          # Send build artifacts
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ env.APP_SERVER_PORT }}" \
            dist/ ${{ env.APP_SERVER }}:$DEPLOY_DIR/client/

          echo "✓ Frontend deployed to $TARGET"
