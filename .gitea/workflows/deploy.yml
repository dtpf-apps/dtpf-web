name: Deploy Frontend (Gitea)

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Set explicitly rather than trusting the runner: the facts.json staleness test
  # (test/config/facts.test.ts) only enforces its 120-day limit when CI is set.
  CI: "true"
  # Deploy target (`user@host`) lives in the repository's Actions variables, not
  # in source: this repo is public and the app server sits on a private network.
  APP_SERVER: ${{ vars.APP_SERVER }}
  APP_SERVER_PORT: 22
  SERVICE_NAME: dtpf
  # Resolved through the runner's hosts file to the reverse proxy, never a
  # backend IP: the registry host was renumbered once and every pipeline pinned
  # to the old address died with EHOSTUNREACH.
  npm_config_registry: https://verdaccio.dtpf.es

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Require deploy target
        run: |
          if [ -z "$APP_SERVER" ]; then
            echo "::error::vars.APP_SERVER is empty — set the repository Actions variable APP_SERVER to user@host (Settings → Actions → Variables) and re-run"
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # pnpm goes before Node: setup-node v5 reads `packageManager` and runs
      # `pnpm store path` to cache the store, and until action-setup has run the
      # only pnpm on PATH is the runner's corepack shim. Measured 2026-10-03: that
      # shim resolved pnpm 12.8.1 to a corepack cache entry pointing at
      # bin/pnpm.cjs, which the 12.x tarball no longer ships, and the job died
      # inside Setup Node.js before pnpm was ever installed.
      - name: Setup pnpm
        # No `version:` input: v6 installs exactly what package.json's
        # `packageManager` pins, so CI and every local install run one pnpm.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          # Per-job install dir: every runner on the CI host shares /home/runner,
          # and concurrent jobs race on the default ~/setup-pnpm (ENOTEMPTY).
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "app_suffix=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_APP_SUFFIX: ${{ steps.env.outputs.app_suffix }}
        run: pnpm build

      - name: Deploy to app server
        env:
          TARGET: ${{ steps.env.outputs.target }}
        run: |
          DEPLOY_DIR="/html/$SERVICE_NAME/$TARGET"
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no -p $APP_SERVER_PORT" \
            dist/ $APP_SERVER:$DEPLOY_DIR/client/
          echo "frontend deployed to $TARGET"

      - name: Notify build failure
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then exit 0; fi
          # Room id (URL-encoded) is a repository Actions variable, like APP_SERVER.
          ROOM="${{ vars.CI_MATRIX_ROOM }}"
          if [ -z "$ROOM" ]; then echo "::warning::vars.CI_MATRIX_ROOM is empty — failure not notified"; exit 0; fi
          REPO="${GITHUB_REPOSITORY#*/}"
          MSG="❌ **${REPO}** Gitea deploy FAILED (${{ github.ref_name }})"
          TXN="ci-$(date +%s%N)"
          curl -sf -X PUT \
            "https://matrixdm.dtpf.es/_matrix/client/v3/rooms/$ROOM/send/m.room.message/$TXN" \
            -H 'Authorization: Bearer ${{ secrets.CI_BUILDS_BOT_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "$MSG" '{msgtype:"m.text",body:$msg}')" \
            || echo "::warning::Element notification failed"
